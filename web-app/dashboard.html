<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel de Gestão - Inquérito ACS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-topbar">
    <div class="app-brand"><strong>Inquérito</strong><span class="app-brand__divider"></span><span>ACS</span></div>
    <div class="app-actions">
      <a id="lnk-admin" class="btn btn-secondary hidden" href="admin.html">Usuários</a>
      <span id="user-role" class="user-role">Perfil</span>
      <button id="btn-logout" type="button" class="btn btn-secondary">Sair</button>
    </div>
  </header>

  <div class="page">
    <div class="page__head">
      <div id="page-eyebrow" class="eyebrow">Gestão</div>
      <h1 id="page-title" class="page__title">Painel de Gestão</h1>
    </div>

    <!-- Cards de Métricas -->
    <div class="metrics-grid">
      <div class="card-metric">
        <h3>Total Entrevistas</h3>
        <p id="total-inqueritos">0</p>
      </div>
      <div class="card-metric alerta">
        <h3>Divergências Detectadas</h3>
        <p id="total-divergencias">0</p>
      </div>
      <div id="card-satisfacao" class="card-metric">
        <h3>Média Satisfação</h3>
        <p id="media-satisfacao">0.0</p>
      </div>
    </div>

    <!-- Tabela de Auditoria por ACS -->
    <section>
      <h2 class="section-title">Acompanhamento por Agente (ACS)</h2>
      <div class="panel table-wrap">
      <table id="tabela-gestao">
        <thead>
          <tr>
            <th>ACS</th>
            <th>Microárea</th>
            <th>Total Entrevistas</th>
            <th>Visitas Confirmadas</th>
            <th>Divergências (e-SUS x Paciente)</th>
            <th>Média Mapeada</th>
          </tr>
        </thead>
        <tbody>
          <!-- Preenchido via API -->
        </tbody>
      </table>
      </div>
    </section>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const voltar = () => { window.location.href = 'index.html'; };

      document.getElementById('btn-logout').addEventListener('click', async () => {
        await fetch('/api/logout', { method: 'POST' }).catch(() => {});
        voltar();
      });

      try {
        const me = await fetch('/api/me');
        if (me.status === 401) { voltar(); return; }
        if (!me.ok) { window.location.href = 'inquerito.html'; return; }
        const eu = await me.json();

        const ehAuditor = eu.perfil === 'auditor';
        if (eu.perfil === 'admin') document.getElementById('lnk-admin').classList.remove('hidden');
        document.getElementById('user-role').innerText = 'Perfil: ' + (eu.perfil === 'admin' ? 'Administrador' : eu.perfil === 'gestor' ? 'Gestão' : 'Auditoria');
        document.getElementById('page-eyebrow').innerText = ehAuditor ? 'Auditoria' : eu.perfil === 'admin' ? 'Administração' : 'Gestão';
        document.getElementById('page-title').innerText = ehAuditor ? 'Painel de Auditoria' : eu.perfil === 'admin' ? 'Painel de Administração e Gestão' : 'Painel de Gestão';

        const endpoint = ehAuditor ? '/api/auditoria/metricas' : '/api/gestao/metricas';
        const res = await fetch(endpoint);
        if (res.status === 401) { voltar(); return; }
        if (res.status === 403) { alert('Acesso não autorizado para este perfil.'); window.location.href = 'inquerito.html'; return; }
        const data = await res.json();

        document.getElementById('total-inqueritos').innerText = data.totalInqueritos;
        document.getElementById('total-divergencias').innerText = data.totalDivergencias;
        if (ehAuditor) {
          document.getElementById('card-satisfacao').classList.add('hidden');
        } else {
          document.getElementById('media-satisfacao').innerText = data.mediaSatisfacao ?? '—';
        }

        const tbody = document.querySelector('#tabela-gestao tbody');
        (data.porAcs || []).forEach((r) => {
          const tr = document.createElement('tr');
          [r.acs_nome, r.microarea, r.total, r.confirmadas, r.divergencias,
           r.media != null ? Number(r.media).toFixed(1) : '—']
            .forEach((v) => { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error('Erro ao carregar métricas:', err);
      }
    });
  </script>
</body>
</html>
