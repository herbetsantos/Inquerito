<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel de Gestão - Inquérito ACS</title>
  <link rel="stylesheet" href="https://cdngovbr-ds.estaleiro.serpro.gov.br/design-system/fonts/rawline/css/rawline.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
      <h1>Painel de Auditoria e Gestão — Inquérito ACS</h1>
      <span class="user-role">Perfil: Gestão</span>
      <button id="btn-logout" type="button" class="btn btn-secondary">Sair</button>
    </header>

  <div class="container-dashboard">

    <!-- Cards de Métricas -->
    <div class="metrics-grid">
      <div class="card-metric">
        <h3>Total Entrevistas</h3>
        <p id="total-inqueritos">0</p>
      </div>
      <div class="card-metric alerta">
        <h3>Divergências Detectadas</h3>
        <p id="total-divergencias">0</p>
      </div>
      <div class="card-metric">
        <h3>Média Satisfação</h3>
        <p id="media-satisfacao">0.0</p>
      </div>
    </div>

    <!-- Tabela de Auditoria por ACS -->
    <section>
      <h2>Acompanhamento por Agente (ACS)</h2>
      <table id="tabela-gestao">
        <thead>
          <tr>
            <th>ACS</th>
            <th>Microárea</th>
            <th>Total Entrevistas</th>
            <th>Visitas Confirmadas</th>
            <th>Divergências (e-SUS x Paciente)</th>
            <th>Média Mapeada</th>
          </tr>
        </thead>
        <tbody>
          <!-- Preenchido via API -->
        </tbody>
      </table>
    </section>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const voltar = () => { window.location.href = 'index.html'; };

      document.getElementById('btn-logout').addEventListener('click', async () => {
        await fetch('/api/logout', { method: 'POST' }).catch(() => {});
        voltar();
      });

      try {
        const res = await fetch('/api/gestao/metricas');
        if (res.status === 401) { voltar(); return; }
        if (res.status === 403) { alert('Acesso restrito ao perfil de gestão.'); window.location.href = 'inquerito.html'; return; }
        const data = await res.json();

        document.getElementById('total-inqueritos').innerText = data.totalInqueritos;
        document.getElementById('total-divergencias').innerText = data.totalDivergencias;
        document.getElementById('media-satisfacao').innerText = data.mediaSatisfacao ?? '—';

        const tbody = document.querySelector('#tabela-gestao tbody');
        (data.porAcs || []).forEach((r) => {
          const tr = document.createElement('tr');
          [r.acs_nome, r.microarea, r.total, r.confirmadas, r.divergencias,
           r.media != null ? Number(r.media).toFixed(1) : '—']
            .forEach((v) => { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error('Erro ao carregar métricas:', err);
      }
    });
  </script>
</body>
</html>
